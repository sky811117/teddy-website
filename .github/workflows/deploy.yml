name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 每天 03:00 UTC = 台灣 11:00 自動 rebuild，讓當天到期的 scheduled post 上線
    # GitHub Actions cron 自然 delay 5-15 分鐘，實際上線約 11:05-11:20 +08
    - cron: "0 3 * * *"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 2026-08-26 補：這步以前漏掉，導致 Card/RelatedPosts 指向的
      # /og/thumbs/*.webp 在 CI 從沒產出、線上一路 404（列表卡片破圖）。
      # package.json 的 build 腳本本來就有這步，但下面跑的是 `astro build`
      # 而不是 `pnpm run build`，整條前綴被繞過。
      - name: Generate OG thumbnails
        run: pnpm exec node scripts/generate-og-thumbs.mjs

      - name: Build site
        run: pnpm exec astro build
        env:
          PUBLIC_GA4_MEASUREMENT_ID: G-WMQCYK4L88
          PUBLIC_GOOGLE_SITE_VERIFICATION: lPDHY5HIn0TAj0hw4A5WRqk_6FUu9hSuqazn9YcjxCY

      - name: Build search index (Pagefind)
        run: pnpm exec pagefind --site dist
        continue-on-error: true

      # 2026-08-26 補：同一個根因漏掉的第二步。dist/_headers.txt 沒被改名成
      # dist/_headers，Cloudflare 完全不吃 public/_headers.txt 的快取規則
      # （實測線上圖片回 max-age=0, must-revalidate，等於每次都回源）。
      - name: Postbuild (_headers rename + pagefind copy)
        run: pnpm exec node scripts/postbuild-headers.mjs

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=teddy-website-blog --branch=main --commit-dirty=true --commit-hash=${{ github.sha }} --commit-message="deploy ${{ github.sha }}"
