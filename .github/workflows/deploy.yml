name: Deploy to Cloudflare Pages

# 最小權限（M-09）：整份 workflow 預設只能讀 repo；需要多的權限由 job 自己宣告。
permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 排程文的門檻是 pubDatetime − 15 分鐘（postFilter）：在門檻之前 push 的那次 build 不會包含它，
    # 要等下一次 push 或下面這兩條 cron 保底 rebuild 才上線。
    # 現況（2026-10-03 查）：每日新聞文 frontmatter 排台灣 08:00、社區評價文 07:00，
    # 但新聞產線 07:30 就 push → 新聞文常要等下一次部署（F047，源頭修正在新聞產線，不在這裡）。
    # 這兩條 cron 只是保底，不要拿來當準時上線的保證。
    # ⚠️ 實測（gh run list --event schedule，2026-08-27 起）：GitHub 對 "0 3 * * *" 這種
    # 整點 cron 的延遲是 4–11 小時（實際 07:11Z–14:41Z 才跑，= 台灣 15:11–22:41），
    # 不是文件寫的「5–15 分鐘」。改成非整點分鐘數 + 兩班，只能降低機率、不保證準時；
    # 真要準點請在家用機 Windows 排程 11:00 跑 `gh workflow run deploy.yml`。
    - cron: "23 2 * * *" # 台灣 10:23 起排隊
    - cron: "41 4 * * *" # 台灣 12:41 起排隊（第一班被延遲時的補班）

# ⚠️ 官網的建置與上線都在這支 workflow（GitHub Actions）：push 到 main 就建置→稽核→wrangler 上傳。
#    Cloudflare Pages 後台的「建置設定」與環境變數裡的 PUBLIC_* 在這個專案不參與建置；Functions 用的環境變數（FIND_*、TURNSTILE_*…）
#    是部署後在 Cloudflare 執行期讀的，改了之後要「重新部署」才生效：`gh workflow run deploy.yml`（約 5～15 分鐘）。
# 夜間物件 sync push 與 IG 圖卡 push 撞在一起時，兩條 deploy 平行跑、Cloudflare 以
# 最後完成者為 production，可能舊蓋新。同一時間只跑一條、後到的排隊（不取消，每次
# push 都要部署到）。
concurrency:
  group: cf-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 2026-10-04（F091）：要完整 git 歷史。scripts/sitemap-lastmod.mjs 用「原始檔最後一次
          # commit 時間」當靜態頁 lastmod；預設淺層 clone 每個檔都會變成這次的 commit（假裝全部更新），
          # 那支偵測到淺層 clone 會直接不給 lastmod。repo 歷史不大，多抓幾秒。
          fetch-depth: 0
          # 資安加固（M-09）：不要把 GITHUB_TOKEN 留在 .git/config 給後面每個步驟讀（建置只用本機 git log／rev-parse，不需要憑證）
          persist-credentials: false

      # pnpm 版本一律吃 package.json 的 packageManager（corepack），不要在這裡再寫死
      # version —— ci.yml 以前寫 10.11.1 跟 packageManager pnpm@11 打架。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ===== 零痕跡洩漏稽核的禁字清單（2026-10-06 紅隊 RT-01／RT-10）=====
      # 完整禁字清單放 GitHub repo → Settings → Secrets and variables → Actions → Secrets → LEAK_DENYLIST
      # （內容就是工作站 leak_denylist.txt 的整份文字）。這一步把它寫到 $RUNNER_TEMP（不在 repo 目錄、不會進 dist、
      # 不會被上傳），再把路徑交給稽核腳本。沒設 secret 就失敗——沒有清單的「通過」不算通過，部署寧可停下來。
      # 以前這裡完全沒有洩漏稽核，文件卻說「Cloudflare 建置會自己再檢查」；Cloudflare Pages 在這個專案不參與建置（wrangler 直接上傳 dist）。
      - name: Prepare leak denylist (from Actions secret)
        env:
          LEAK_DENYLIST_TEXT: ${{ secrets.LEAK_DENYLIST }}
        run: |
          if [ -z "$LEAK_DENYLIST_TEXT" ]; then
            echo "::error::GitHub Actions secret LEAK_DENYLIST 沒有設定：沒有禁字清單，洩漏稽核無法進行，部署中止。設定方式見 官網側實作/01_景泰手動設定清單.md"
            exit 1
          fi
          umask 077
          printf '%s\n' "$LEAK_DENYLIST_TEXT" > "$RUNNER_TEMP/leak_denylist.txt"
          echo "LEAK_DENYLIST=$RUNNER_TEMP/leak_denylist.txt" >> "$GITHUB_ENV"

      # ===== 以下步驟順序 = package.json `build`（唯一真相），兩邊要一起改 =====
      # lint-seo → audit-properties → og-thumbs → cover-thumbs → astro check → astro build
      #   → pagefind → postbuild-minify → postbuild(headers)

      # 2026-08-27 補：內容紅線閘門。景泰 2026-06 清過 51 篇 AI 編造的客戶故事，
      # 兩個月後又長回 23 篇（供文管線沒有防呆），這一步就是防第三次。
      # 擋：編造的第一人稱客戶故事 / 同業品牌比較 / 教議價殺價。
      # 要暫時放行（例如誤判擋住緊急更新）就把這步註解掉，修完再打開。
      - name: Content lint (文章紅線閘門)
        run: pnpm exec node scripts/lint-seo.mjs

      # 2026-09-06 補：物件法規閘門。以前只掛在從沒跑過的 ci.yml 而且 `|| true`，
      # 結果完整門牌 / 同事手機 / 「經紀人：柯百聲」/ 誇大詞 / 漲跌預測 全部直接上線。
      # 有 ERROR 就 exit 1 擋部署。物件 md 是每晚自動產生的，不要手改 md ——
      # 要修 ~/.claude/skills/properties-sync/scripts/apply_utrust.py 的清洗規則。
      - name: Property audit (物件法規閘門)
        run: pnpm exec node scripts/audit-properties.mjs

      # 2026-08-26 補：這步以前漏掉，導致 Card/RelatedPosts 指向的
      # /og/thumbs/*.webp 在 CI 從沒產出、線上一路 404（列表卡片破圖）。
      - name: Generate OG thumbnails
        run: pnpm exec node scripts/generate-og-thumbs.mjs

      # 2026-10-04（F027）：物件封面縮圖（800／400 webp），列表卡、首頁卡、相關卡用。
      # 腳本失敗只印 WARN、永遠 exit 0；模板 build 時檢查縮圖在不在，不在就退回原圖，不會破圖。
      # 必須在 astro build 之前（模板要在 build 時看得到 public/ 裡的縮圖）。
      - name: Generate property cover thumbnails
        run: pnpm exec node scripts/generate-cover-thumbs.mjs

      # 型別 / 模板錯誤以前不擋部署（只有本機 pnpm run build 會跑）
      - name: Astro check
        run: pnpm exec astro check

      # PUBLIC_* 是 build 時烘進 HTML 的（astro:env/client），Cloudflare Pages 後台的
      # 環境變數對這裡的 build 完全不可見（wrangler 直接上傳 dist，Pages 不參與 build）。
      # 所以任何 PUBLIC_* 都要在這裡給值。
      # PUBLIC_FORMSPREE_FORM_ID：到 GitHub repo → Settings → Secrets and variables →
      # Actions → Variables 設 PUBLIC_FORMSPREE_FORM_ID（Formspree 表單 id，景泰自己註冊）；
      # 沒設 = 空字串 = 維持現狀（ContactForm 走 /api/contact-tg 或顯示 LINE 備援）。
      - name: Build site
        run: pnpm exec astro build
        env:
          PUBLIC_GA4_MEASUREMENT_ID: G-WMQCYK4L88
          PUBLIC_GOOGLE_SITE_VERIFICATION: lPDHY5HIn0TAj0hw4A5WRqk_6FUu9hSuqazn9YcjxCY
          PUBLIC_FORMSPREE_FORM_ID: ${{ vars.PUBLIC_FORMSPREE_FORM_ID }}

      # 以前掛 continue-on-error，pagefind 失敗會靜默上線一個空白的 /search/。
      # package.json build 是 && 串接（失敗就停），這裡對齊。
      - name: Build search index (Pagefind)
        run: pnpm exec pagefind --site dist

      # 2026-10-04（F116）：壓縮 dist/js/*.js（工具頁三支腳本），public/ 原檔不動。
      # 失敗只印 WARN、保留未壓縮原檔，永遠 exit 0，不擋部署。
      - name: Minify tool scripts (dist/js)
        run: pnpm exec node scripts/postbuild-minify.mjs

      # 2026-08-26 補：同一個根因漏掉的第二步。dist/_headers.txt 沒被改名成
      # dist/_headers，Cloudflare 完全不吃 public/_headers.txt 的快取規則
      # （實測線上圖片回 max-age=0, must-revalidate，等於每次都回源）。
      # 2026-10-03 起另外做：dist/sitemap.xml、下架物件 301（_redirects 超過 2,000 條會讓這步失敗）、
      # 刪 dist 裡沒產頁的物件照片、本站絕對網址少尾斜線的 WARN。
      # 2026-10-04 起：下架轉址另讀 src/data/withdrawn-properties.json 帳本（不存在就只看 md）；
      # Noto Sans TC 的 @font-face 從每頁內嵌抽成 dist/_astro/fonts/noto-tc-<hash>.css（失敗只 WARN）。
      - name: Postbuild (_headers rename + pagefind copy + 尾斜線)
        run: pnpm exec node scripts/postbuild-headers.mjs

      - name: Verify build output
        run: |
          test -f dist/_headers || (echo "dist/_headers missing" && exit 1)
          test -f dist/pagefind/pagefind.js || (echo "dist/pagefind/pagefind.js missing" && exit 1)
          test -f dist/index.html || (echo "dist/index.html missing" && exit 1)
          test -f dist/sitemap.xml || (echo "dist/sitemap.xml missing" && exit 1)

      # 2026-10-06 補（紅隊 RT-01）：零痕跡洩漏稽核＋找房小幫手測試——擋部署的關卡，不是參考。
      # build-safe 的 --skip-build --no-diff 會依序跑：dist 禁字（原文／正規化／壓平，至少掃到 8 個檔案）、對外主機白名單、
      # 沒有 sourcemap、Functions 打包物禁字、tests/find 全部測試。任何一步失敗整條部署失敗（不會上傳到 Cloudflare）。
      # 輸出只列「檔案:行:規則編號」，不印命中的字串。要暫時放行請「修內容」，不要拿掉這一步（拿掉就沒有人把關了）。
      - name: Leak audit + find tests (gate)
        run: node scripts/build-safe.mjs --skip-build --no-diff

      # 2026-09-29 補：IndexNow（Bing / Yandex / Naver；ChatGPT 搜尋、Copilot 吃的是 Bing 索引）。
      # 部署「前」先把線上現有的 sitemap 存成舊版（放 runner.temp，不進 dist、不會被上傳），
      # 部署成功「後」拿 dist 的 sitemap 比對：新出現的網址 + lastmod 有變的網址才推。
      # 線上 sitemap 抓不到 → 只推 lastmod 在最近 2 天內的，不整站推。
      # 兩步都 continue-on-error，腳本本身也永遠 exit 0 —— IndexNow 掛掉絕不能擋部署。
      # 腳本自帶時限（snapshot 60 秒、推送 150 秒）刻意比下面的 timeout-minutes 短；
      # 要調低 timeout-minutes 先改腳本底部的 DEADLINE_MS，不然會變成被 GitHub 砍掉。
      # 金鑰不寫在這裡：腳本從 dist 根目錄的 <key>.txt 驗證檔讀（public/ 裡那支）。
      - name: Snapshot live sitemap (IndexNow 舊版)
        continue-on-error: true
        timeout-minutes: 2
        run: node scripts/indexnow-submit.mjs --snapshot "$RUNNER_TEMP/indexnow-live-sitemap.json"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=teddy-website-blog --branch=main --commit-dirty=true --commit-hash=${{ github.sha }} --commit-message="deploy ${{ github.sha }}"

      # 只有上一步部署成功才會跑到這裡（沒寫 if = success()）。log 會印推了幾筆、HTTP 狀態碼，
      # 網址清單寫在這次 run 的 Summary 頁。
      - name: Submit changed URLs to IndexNow
        continue-on-error: true
        timeout-minutes: 3
        run: node scripts/indexnow-submit.mjs --old "$RUNNER_TEMP/indexnow-live-sitemap.json"
